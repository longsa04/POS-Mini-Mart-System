spring.application.name=cmpos-backend
spring.datasource.url=jdbc:mysql://localhost:3306/pos?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_db_password_here}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8090
pos.tax.rate=0.12
security.jwt.secret=${JWT_SECRET:your_jwt_secret_here}
security.jwt.expiration-ms=3600000
